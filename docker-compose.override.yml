version: "3.8"

services:
  backend:
    environment:
      NODE_ENV: development
    command: sh -c "npm install && npm run dev"

  frontend:
    environment:
      NODE_ENV: development
      # Empty base = same-origin /api, forwarded by the Vite proxy below.
      VITE_API_URL: ""
      VITE_PROXY_TARGET: http://backend:3000
    command: sh -c "npm install && npm run dev"
